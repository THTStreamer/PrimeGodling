plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // ── CurseForge Maven — tensura-reincarnated, manascore, etc. Published by project authors. ──
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // ── Modrinth Maven — geckolib and other Fabric/NeoForge libs ─────────────────────────
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // ── Central fallback ───────────────────────────────────────────────────────────────
    mavenCentral()

    // ── Local flat-dir repository for manual dependency JARs ──────────────────────────
    flatDir {
        dirs 'libs'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = "gameTestServer" }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ── Local flat-dir — JARs copied to primegodling/libs/ from test instance ──────
    // ManasCore (main jar re-exports all sub-modules at runtime)
    implementation name: 'manascore-neoforge-4.0.0.2'

    // ManasCore sub-modules (needed at compile time since main jar only embeds them)
    implementation name: 'manascore-architectury-neoforge-4.0.0.2'
    implementation name: 'manascore-attribute-neoforge-4.0.0.2'
    implementation name: 'manascore-command-neoforge-4.0.0.2'
    implementation name: 'manascore-config-neoforge-4.0.0.2'
    implementation name: 'manascore-inventory-neoforge-4.0.0.2'
    implementation name: 'manascore-keybind-neoforge-4.0.0.2'
    implementation name: 'manascore-network-neoforge-4.0.0.2'
    implementation name: 'manascore-race-neoforge-4.0.0.2'
    implementation name: 'manascore-skill-neoforge-4.0.0.2'
    implementation name: 'manascore-storage-neoforge-4.0.0.2'

    // Architectury (required by ManasCore's Registrar API)
    implementation name: 'architectury-13.0.8-neoforge'

    // Tensura: Reincarnated (required to reference Tensura classes at compile time)
    implementation name: 'tensura-neoforge-2.0.0.8'

    // GeckoLib (required by RaceModelRegistry for model rendering)
    implementation name: 'geckolib-neoforge-1.21.1-4.8.4'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
