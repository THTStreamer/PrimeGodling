# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader
loaderVersion="${loader_version_range}" #mandatory

# The license for you mod.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
issueTrackerURL="https://github.com/PrimeGodling/primegodling/issues" #optional

[[mods]] #mandatory
    modId="${mod_id}" #mandatory
    version="${mod_version}" #mandatory
    displayName="${mod_name}" #mandatory
    description='''
    A Tensura: Reincarnated 1.21.1 addon introducing the Godling race, a 7-stage evolution chain leading to Primordial Supreme God,
    and the Divine Nexus — a new third awakening path alongside True Demon Lord and True Hero.
    ''' #mandatory
    authors="${mod_authors}"
    displayURL="https://www.curseforge.com/minecraft/mc-mods/prime-godling-tensura-addon"
    credits="Built for the Tensura: Reincarnated 1.21.1 modding community."

# [[mixins]]
# config="${mod_id}.mixins.json"

# ── Dependencies ────────────────────────────────────────────────────
# NeoForge
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"

# Minecraft
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"

# ── Tensura: Reincarnated (base mod) ────────────────────────────────────
[[dependencies.${mod_id}]]
    modId="tensura"
    type="required"
    versionRange="[1.21.1,)"
    ordering="AFTER"
    side="BOTH"

# ── ManasCore (Tensura shared API — required) ───────────────────────────
[[dependencies.${mod_id}]]
    modId="manascore"
    type="required"
    versionRange="[1.21.1,)"
    ordering="AFTER"
    side="BOTH"

# ── GeckoLib ────────────────────────────────────────────────────────────
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.4,)"
    ordering="NONE"
    side="BOTH"

#[features.${mod_id}]
#openGLVersion="[4.1,)"  # Re-enable once GeckoLib dependency is active
